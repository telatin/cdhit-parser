# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: |
          requirements.txt
          setup.cfg
          pyproject.toml
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest
    - name: Install your custom tools
      run: pip install .
    - name: Install rich-codex
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-firacode
        python -m pip install "rich-codex[cairo]"
    - name: Generate terminal images
      run: rich-codex
      env:
        LOG_SAVE: "true"
        NO_CONFIRM: "true"
    - name: Commit generated images
      shell: bash
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        echo "Git status after rich-codex:"
        git status -s
        if [[ -f created.txt || -f deleted.txt ]]; then
          [[ -f created.txt ]] && xargs -r git add < created.txt
          [[ -f deleted.txt ]] && xargs -r git rm < deleted.txt
          git commit -m "Generate new screengrabs with rich-codex"
          git push
        else
          echo "No rich-codex changes found."
        fi
    - name: Upload rich-codex log artifact
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: rich-codex-log
        path: rich_codex_*.log
        if-no-files-found: ignore
